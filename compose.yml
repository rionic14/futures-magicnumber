services:
  futures-number:
    build: .
    container_name: futures-number
    restart: unless-stopped
    ports:
      - "54321:54321"
    volumes:
      - ./runtime:/usr/share/nginx/html/runtime
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /usr/share/nginx/html/runtime/data.js ]; then
          cp /usr/share/nginx/html/data.js /usr/share/nginx/html/runtime/data.js
        fi
        exec nginx -g 'daemon off;'

  futures-number-updater:
    image: python:3.13-alpine
    container_name: futures-number-updater
    restart: unless-stopped
    environment:
      KBO_DATA_PATH: /data/data.js
    volumes:
      - ./runtime:/data
      - ./tools/update_kbo_data.py:/app/update_kbo_data.py:ro
    command:
      - python3
      - /app/update_kbo_data.py
      - --serve
