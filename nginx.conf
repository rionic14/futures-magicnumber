limit_req_zone $binary_remote_addr zone=refresh:10m rate=2r/m;

server {
    listen 54321;
    listen [::]:54321;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /runtime/data.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /api/refresh {
        limit_req zone=refresh burst=1 nodelay;
        proxy_pass http://futures-number-updater:8000/refresh;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ /\. {
        deny all;
    }
}
